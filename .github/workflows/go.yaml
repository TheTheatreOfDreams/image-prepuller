name: Go

on:
  pull_request:
  push:
    branches: ["master", "develop"]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Go linters
        uses: TheatreOfDreamsDev/actions/go/lint@main

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Go tests
        uses: TheatreOfDreamsDev/actions/go/unit@main
