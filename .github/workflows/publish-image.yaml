name: Publish image

on:
  push:
    tags:
    - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/theatreofdreamsdev/prepuller

jobs:
  publish:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Publish image
      uses: TheatreOfDreamsDev/actions/docker/publish-image@main
      with:
        image-name: ${{ env.IMAGE_NAME }}
        tag: ${{ inputs.tag }}
        password: ${{ secrets.GITHUB_TOKEN }}
        platforms: linux/amd64,linux/arm64
