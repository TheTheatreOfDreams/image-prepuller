name: Publish image

on:
  push:
    tags:
    - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/thetheatreofdreams/prepuller

jobs:
  publish:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Resolve image tag
      id: image
      env:
        DISPATCH_TAG: ${{ inputs.tag }}
      run: |
        if [ -n "${DISPATCH_TAG}" ]; then
          tag="${DISPATCH_TAG}"
        else
          tag="${GITHUB_REF_NAME}"
        fi

        if [ -z "${tag}" ]; then
          echo "Unable to resolve image tag" >&2
          exit 1
        fi

        echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: true
        platforms: linux/amd64,linux/arm64
        tags: |
          ${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}
