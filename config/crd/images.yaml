apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: images.prepuller.theatreofdreams.dev
spec:
  group: prepuller.theatreofdreams.dev
  names:
    kind: Image
    listKind: ImageList
    plural: images
    singular: image
  scope: Cluster
  versions:
  - name: v1alpha1
    served: true
    storage: true
    additionalPrinterColumns:
    - name: Reference
      type: string
      jsonPath: .spec.reference
    - name: Last Seen
      type: date
      jsonPath: .status.lastSeen
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required:
            - reference
            properties:
              reference:
                type: string
                minLength: 1
              platforms:
                type: object
                additionalProperties:
                  type: string
          status:
            type: object
            properties:
              lastSeen:
                type: string
                format: date-time
              observedIn:
                type: array
                items:
                  type: object
                  required:
                  - namespace
                  - name
                  properties:
                    namespace:
                      type: string
                    name:
                      type: string
    subresources:
      status: {}
